name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-22:
    name: node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit and wrapper tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Launcher syntax
        run: node --check bin/pi-main.mjs
      - name: Installer syntax
        run: bash -n install.sh

  node-24:
    name: node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Unit and wrapper tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Launcher syntax
        run: node --check bin/pi-main.mjs
      - name: Installer syntax
        run: bash -n install.sh
